name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate release source and version
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          test -n "${TAG_COMMIT}"
          git merge-base --is-ancestor "${TAG_COMMIT}" origin/main
          PACKAGE_VERSION="$(python scripts/check_version.py)"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade "pip<27" "build<2"
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 14

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build portable Windows package
        shell: cmd
        run: scripts\build_windows.bat
      - name: Validate packaged CLI
        shell: pwsh
        run: |
          .\dist\windows\diskvis.exe --version
          .\dist\windows\diskvis.exe dashboard --help
          $exePath = (Resolve-Path ".\dist\windows\diskvis.exe").Path
          $process = Start-Process -FilePath $exePath -ArgumentList @("dashboard", ".", "--port", "8765", "--no-open-browser", "--no-save-snapshot") -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                # The one-file executable can take a few seconds to unpack.
              }
            }
            if (-not $ready) {
              throw "Packaged Dashboard did not become ready."
            }
          } finally {
            $packagedProcesses = Get-CimInstance Win32_Process -Filter "Name = 'diskvis.exe'" |
              Where-Object { $_.ExecutablePath -eq $exePath }
            foreach ($packagedProcess in $packagedProcesses) {
              Stop-Process -Id $packagedProcess.ProcessId -Force
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: dist/DiskSpaceVisualizer-*-Windows.zip
          retention-days: 14

  publish:
    needs: [python-dist, windows-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
      - name: Flatten artifacts and create checksums
        shell: bash
        run: |
          mkdir release-assets-flat
          find release-assets -type f -not -name SHA256SUMS.txt -exec cp {} release-assets-flat/ \;
          (cd release-assets-flat && sha256sum *.whl *.tar.gz *.zip > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets-flat/*
