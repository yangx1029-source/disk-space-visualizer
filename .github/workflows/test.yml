name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade "pip<27"
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Build distributions
        run: python -m build

      - name: Check dependencies
        run: python -m pip check

      - name: Validate version source
        run: python scripts/check_version.py

      - name: Install wheel smoke test
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/python -m diskvis.cli --version
          .ci-venv/bin/python -m diskvis.cli scan . --top 1 --ignore .git
          .ci-venv/bin/python -c "from pathlib import Path; from diskvis.dashboard.server import DashboardConfig, DashboardServer; server = DashboardServer(DashboardConfig(root=Path('.'), port=0, save_snapshot=False)); server.start_background(); assert server.url.startswith('http://127.0.0.1:'); server.close()"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<27"
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade "pip<27"
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pytest -m browser

  platform-core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<27"
          python -m pip install -e ".[dev]"

      - name: Run platform core tests
        run: pytest tests/test_scanner.py tests/test_deep_scan.py tests/test_snapshot_v2.py
