[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "disk-space-visualizer"
dynamic = ["version"]
description = "Cross-platform disk space analyzer with snapshots, comparisons, duplicate detection, and interactive HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Disk Space Visualizer Contributors" }]
keywords = [
  "disk",
  "storage",
  "visualization",
  "cli",
  "echarts",
  "treemap",
  "duplicates",
  "snapshot",
  "dashboard",
  "web",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/yangx1029-source/disk-space-visualizer"
Repository = "https://github.com/yangx1029-source/disk-space-visualizer"
Issues = "https://github.com/yangx1029-source/disk-space-visualizer/issues"
Changelog = "https://github.com/yangx1029-source/disk-space-visualizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "ruff>=0.9.0",
]

browser = [
  "playwright>=1.50.0",
]

windows = [
  "pyinstaller>=6.10",
]

[project.scripts]
diskvis = "diskvis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["diskvis"]

[tool.hatch.version]
path = "diskvis/version.py"

[tool.hatch.build.targets.wheel.force-include]
"diskvis/templates/report.html.j2" = "diskvis/templates/report.html.j2"
"diskvis/templates/comparison.html.j2" = "diskvis/templates/comparison.html.j2"
"diskvis/dashboard/templates/index.html.j2" = "diskvis/dashboard/templates/index.html.j2"
"CHANGELOG.md" = "CHANGELOG.md"
"LICENSE" = "LICENSE"
"README.md" = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
  "browser: Chromium-based HTML report and Dashboard integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "SIM", "PIE", "RUF", "N"]
ignore = ["N818", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"diskvis/cli.py" = ["B008"]
"tests/test_report_browser.py" = ["E402", "I001"]
"tests/test_dashboard_browser.py" = ["E402", "I001"]
